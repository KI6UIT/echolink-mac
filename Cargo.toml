[package]
name = "echolink-tui"
version = "0.3.0"
edition = "2024"
description = "EchoLink client for the Linux and macOS terminal"
license = "GPL-2.0-or-later"

[lib]
name = "echolink"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:image"]

[[bin]]
name = "echolink-tui"
path = "src/bin/echolink-tui/main.rs"

[[bin]]
name = "echolink-gui"
path = "src/bin/echolink-gui/main.rs"
required-features = ["gui"]

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.15"
crossterm = "0.28"
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui_extras = { version = "0.31", features = ["image", "gif"], optional = true }
# Only here to switch on the picture formats QRZ profile photos use.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"], optional = true }
flate2 = "1.1.10"
md5 = "0.8.1"
nnnoiseless = { version = "0.5.2", default-features = false }
ratatui = "0.29"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = "2"
toml = "1.1.8"

# Window-system backends are only needed on Linux/BSD; macOS uses its native one.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11"], optional = true }

# System-wide push-to-talk key (Carbon hotkeys; needs no extra permission).
[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"
